<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
		<meta http-equiv="Pragma" content="no-cache">
		<meta http-equiv="Expires" content="0">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--$GODOT_SPLASH_SHOW_IMAGE fullsize--$GODOT_SPLASH_FULLSIZE use-filter--$GODOT_SPLASH_USE_FILTER" src="$GODOT_SPLASH_IMAGE" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="$GODOT_URL"></script>
		<!-- Firebase Auth Web Module -->
		<script type="module">
			import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
			import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

			const firebaseConfig = {
				apiKey: "AIzaSyDDe8OAmIP6vAF1iScuSb0Wo35X3o60-Bg",
				authDomain: "pokemon-battle-frontier-4add7.firebaseapp.com",
				projectId: "pokemon-battle-frontier-4add7"
			};

			const app = initializeApp(firebaseConfig);
			const auth = getAuth(app);
			const provider = new GoogleAuthProvider();
			provider.setCustomParameters({ prompt: 'select_account' });

			window.firebaseAuthStatus = {
				state: "idle",
				email: "",
				name: "",
				uid: "",
				error: ""
			};

			window.saveRememberedCloudUser = function(email, alias) {
				try {
					if (email) localStorage.setItem("pkmn_cloud_email", email.trim().toLowerCase());
					if (alias) localStorage.setItem("pkmn_cloud_alias", alias.trim());
				} catch (e) {
					console.warn("[WebAuth] localStorage write failed:", e);
				}
			};

			window.getRememberedCloudUser = function() {
				try {
					const email = localStorage.getItem("pkmn_cloud_email") || "";
					const alias = localStorage.getItem("pkmn_cloud_alias") || "";
					return JSON.stringify({ email: email, alias: alias });
				} catch (e) {
					return JSON.stringify({ email: "", alias: "" });
				}
			};

			window.clearRememberedCloudUser = function() {
				try {
					localStorage.removeItem("pkmn_cloud_email");
					localStorage.removeItem("pkmn_cloud_alias");
				} catch (e) {
					console.warn("[WebAuth] localStorage remove failed:", e);
				}
			};

			window.loginWithGoogleWeb = async function() {
				window.firebaseAuthStatus = { state: "pending", email: "", name: "", uid: "", error: "" };
				try {
					const result = await signInWithPopup(auth, provider);
					const user = result.user;
					const alias = user.displayName || user.email.split('@')[0];
					window.saveRememberedCloudUser(user.email, alias);
					window.firebaseAuthStatus = {
						state: "success",
						email: user.email,
						name: alias,
						uid: user.uid,
						error: ""
					};
					console.log("[WebAuth] Successfully logged in:", user.email, alias);
					return JSON.stringify(window.firebaseAuthStatus);
				} catch (err) {
					console.error("[WebAuth] Error during popup sign-in:", err);
					let errorMsg = err.message;
					if (err.code === 'auth/unauthorized-domain') {
						errorMsg = "Dominio no autorizado en Firebase. Agrega 'yodef.github.io' en Firebase Console > Authentication > Settings > Authorized domains.";
					} else if (err.code === 'auth/popup-closed-by-user') {
						errorMsg = "Ventana de Google cerrada por el usuario.";
					} else if (err.code === 'auth/popup-blocked') {
						errorMsg = "El navegador bloqueó la ventana emergente de Google. Permite ventanas emergentes para este sitio.";
					}
					window.firebaseAuthStatus = {
						state: "error",
						email: "",
						name: "",
						uid: "",
						error: errorMsg
					};
					return JSON.stringify(window.firebaseAuthStatus);
				}
			};

			window.getFirebaseAuthStatus = function() {
				return JSON.stringify(window.firebaseAuthStatus);
			};
		</script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
if (GODOT_CONFIG && typeof GODOT_CONFIG === 'object') {
	GODOT_CONFIG.mainPack = "index.pck?v=" + Date.now();
}
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
