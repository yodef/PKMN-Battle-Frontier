<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pokémon Battle Frontier • Conexión con Google</title>
  <link rel="icon" type="image/png" href="index.icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at 50% 20%, #152238 0%, #080d16 100%);
      color: #e0e6ed;
      font-family: 'Rubik', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .card {
      background: rgba(18, 28, 45, 0.95);
      border: 1px solid #2a4365;
      border-radius: 18px;
      padding: 32px 24px;
      width: 100%;
      max-width: 440px;
      text-align: center;
      box-shadow: 0 16px 40px rgba(0,0,0,0.6);
      backdrop-filter: blur(10px);
    }
    .icon-badge {
      font-size: 44px;
      margin-bottom: 12px;
      animation: bounce 2s infinite ease-in-out;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    .title {
      font-size: 20px;
      font-weight: 700;
      color: #f1c40f;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      text-shadow: 0 2px 8px rgba(241,196,15,0.3);
    }
    .subtitle {
      font-size: 14px;
      color: #8da2be;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .btn-google {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      background: #ffffff;
      color: #1f1f1f;
      border: none;
      border-radius: 12px;
      padding: 15px 20px;
      font-size: 15px;
      font-weight: 600;
      font-family: 'Rubik', sans-serif;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,0.3);
      transition: all 0.2s ease;
    }
    .btn-google:hover {
      background: #f1f3f4;
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(0,0,0,0.4);
    }
    .btn-google:active { transform: translateY(0); }
    .btn-google:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .status-msg {
      margin-top: 18px;
      font-size: 13px;
      color: #9cb3ce;
      line-height: 1.4;
      min-height: 20px;
    }
    .error-box {
      margin-top: 16px;
      padding: 12px;
      background: rgba(231, 76, 60, 0.15);
      border: 1px solid #e74c3c;
      border-radius: 10px;
      color: #ff7675;
      font-size: 13px;
      text-align: left;
      display: none;
    }
    .footer {
      margin-top: 24px;
      font-size: 11px;
      color: #55687d;
    }
  </style>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDDe8OAmIP6vAF1iScuSb0Wo35X3o60-Bg",
      authDomain: "pokemon-battle-frontier-4add7.firebaseapp.com",
      projectId: "pokemon-battle-frontier-4add7"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });

    const params = new URLSearchParams(window.location.search);
    const sessionId = params.get('session');

    async function triggerGoogleLogin() {
      const btn = document.getElementById('btn-google');
      const status = document.getElementById('status-msg');
      const errorBox = document.getElementById('error-box');
      errorBox.style.display = 'none';
      btn.disabled = true;
      status.innerHTML = "⏳ Abriendo selector de cuentas de Google...";

      try {
        const result = await signInWithPopup(auth, provider);
        const user = result.user;
        const alias = user.displayName || user.email.split('@')[0];
        status.innerHTML = "✅ ¡Cuenta verificada! Sincronizando con el juego...";

        if (sessionId) {
          const firestoreUrl = `https://firestore.googleapis.com/v1/projects/pokemon-battle-frontier-4add7/databases/(default)/documents/auth_sessions/${encodeURIComponent(sessionId)}?key=${firebaseConfig.apiKey}`;
          const payload = {
            fields: {
              email: { stringValue: user.email },
              name: { stringValue: alias },
              uid: { stringValue: user.uid },
              timestamp: { integerValue: Date.now().toString() }
            }
          };

          await fetch(firestoreUrl, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
        }

        document.getElementById('card-content').innerHTML = `
          <div style="font-size:48px;margin-bottom:12px;">🎉</div>
          <h2 style="color:#2ecc71;font-size:22px;margin-bottom:8px;">¡Sesión Iniciada con Éxito!</h2>
          <p style="color:#e0e6ed;font-size:15px;margin-bottom:12px;">Bienvenido, <b>${alias}</b></p>
          <p style="color:#8da2be;font-size:13px;margin-bottom:20px;">Tu cuenta <code>${user.email}</code> ha sido vinculada con el juego.</p>
          <div style="background:rgba(46,204,113,0.15);border:1px solid #2ecc71;padding:12px;border-radius:10px;color:#a8f0c6;font-size:13px;margin-bottom:16px;">
            🎮 <b>Ya puedes regresar al juego</b> para continuar tu aventura en el Frente de Batalla.
          </div>
          <p style="color:#55687d;font-size:11px;">Esta ventana se cerrará automáticamente en unos segundos.</p>
        `;

        setTimeout(() => {
          try { window.close(); } catch(e) {}
        }, 3500);

      } catch (err) {
        console.error("Auth error:", err);
        btn.disabled = false;
        status.innerHTML = "";
        errorBox.style.display = 'block';

        if (err.code === 'auth/unauthorized-domain') {
          errorBox.innerHTML = "<b>⚠️ Dominio no autorizado en Firebase:</b><br>Debes agregar <code>yodef.github.io</code> en Firebase Console &gt; Authentication &gt; Settings &gt; Authorized domains.";
        } else if (err.code === 'auth/popup-closed-by-user') {
          errorBox.innerHTML = "⚠️ Cancelaste la ventana de inicio de sesión. Toca de nuevo para reintentar.";
        } else if (err.code === 'auth/popup-blocked') {
          errorBox.innerHTML = "⚠️ El navegador bloqueó la ventana emergente. Permite ventanas emergentes para este sitio.";
        } else {
          errorBox.innerHTML = "❌ Error: " + err.message;
        }
      }
    }

    window.triggerGoogleLogin = triggerGoogleLogin;
  </script>
</head>
<body>
  <div class="card" id="card-content">
    <div class="icon-badge">⚡</div>
    <div class="title">POKÉMON BATTLE FRONTIER</div>
    <div class="subtitle">Conecta con tu cuenta de Google para restaurar o sincronizar tu colección y progreso en tiempo real.</div>
    <button id="btn-google" class="btn-google" onclick="triggerGoogleLogin()">
      <svg width="20" height="20" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
      Continuar con Google
    </button>
    <div class="status-msg" id="status-msg">Toca arriba para elegir tu cuenta de Google.</div>
    <div class="error-box" id="error-box"></div>
    <div class="footer">Google Cloud Firestore • Cifrado seguro</div>
  </div>
</body>
</html>
